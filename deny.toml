[advisories]
version = 2

db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

yanked = "deny"

ignore = []

[licenses]
version = 2

# Commented licenses would be allowed yet are not currently in use
allow = [
  # Effective public domain
  "CC0-1.0",
  # "Unlicense",

  # Attribution required
  "MIT",
  # "MITNFA",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",

  # Non-invasive copyleft
  "MPL-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "GPL-3.0 WITH Classpath-exception-2.0",
  "GPL-3.0-or-later WITH Classpath-exception-2.0",
]

exceptions = [
  { allow = ["AGPL-3.0-only"], name = "pallet-session" },
  { allow = ["AGPL-3.0-only"], name = "serai-polkadot-sdk" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = [
  { name = "serde_derive", version = ">=1.0.172, <1.0.185" },
  { name = "hashbrown", version = "=0.15.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/serai-dex/serai"]
