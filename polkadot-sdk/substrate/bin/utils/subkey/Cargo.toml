[package]
name = "subkey"
version = "25.0.0"
description = "Generate and restore keys for Substrate based chains such as Polkadot, Kusama and a growing number of parachains and Substrate based projects."
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[[bin]]
path = "src/main.rs"
name = "subkey"

[dependencies.clap]
features = ["derive"]
workspace = true

[dependencies.sc-cli]
default-features = true
workspace = true
