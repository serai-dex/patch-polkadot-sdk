[package]
name = "staging-chain-spec-builder"
version = "11.0.0"
build = "build.rs"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
publish = true
description = "Utility for building chain-specification files for Substrate-based runtimes based on `sp-genesis-builder`"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[[bin]]
path = "bin/main.rs"
name = "chain-spec-builder"

[lib]
doctest = false

[dependencies.clap]
features = ["derive"]
workspace = true

[dependencies.docify]
workspace = true

[dependencies.sc-chain-spec]
features = ["clap"]
workspace = true
default-features = true

[dependencies.serde]
workspace = true
default-features = true

[dependencies.serde_json]
workspace = true
default-features = true

[dependencies.sp-tracing]
default-features = true
workspace = true

[features]
generate-readme = []
