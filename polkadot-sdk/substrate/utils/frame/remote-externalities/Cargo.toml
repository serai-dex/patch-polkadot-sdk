[package]
name = "frame-remote-externalities"
version = "0.51.0"
license = "Apache-2.0"
description = "An externalities provided environment that can load itself from remote nodes or cached files"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
workspace = true
default-features = true

[dependencies.futures]
workspace = true

[dependencies.indicatif]
workspace = true

[dependencies.jsonrpsee]
features = ["http-client"]
workspace = true

[dependencies.log]
workspace = true
default-features = true

[dependencies.serde]
workspace = true
default-features = true

[dependencies.sp-core]
default-features = true
workspace = true

[dependencies.sp-crypto-hashing]
default-features = true
workspace = true

[dependencies.sp-io]
default-features = true
workspace = true

[dependencies.sp-runtime]
default-features = true
workspace = true

[dependencies.sp-state-machine]
default-features = true
workspace = true

[dependencies.spinners]
workspace = true

[dependencies.substrate-rpc-client]
default-features = true
workspace = true

[dependencies.tokio]
features = [
    "macros",
    "rt-multi-thread",
]
workspace = true
default-features = true

[dependencies.tokio-retry]
workspace = true

[features]
remote-test = []
