[package]
name = "substrate-bip39"
version = "0.6.0"
license = "Apache-2.0"
description = "Converting BIP39 entropy to valid Substrate (sr25519) SecretKeys"
documentation = "https://docs.rs/substrate-bip39"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.repository]
workspace = true

[dependencies.hmac]
workspace = true

[dependencies.pbkdf2]
workspace = true

[dependencies.schnorrkel]
workspace = true

[dependencies.sha2]
workspace = true

[dependencies.zeroize]
workspace = true

[features]
default = ["std"]
std = [
    "hmac/std",
    "pbkdf2/std",
    "schnorrkel/std",
    "sha2/std",
    "zeroize/alloc",
    "zeroize/std",
]
