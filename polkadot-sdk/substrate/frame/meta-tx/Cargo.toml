[package]
name = "pallet-meta-tx"
description = "FRAME pallet enabling meta transactions."
license = "Apache-2.0"
version = "0.2.0"

[package.edition]
workspace = true

[package.authors]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[lints]
workspace = true

[dependencies.codec]
workspace = true
features = ["max-encoded-len"]

[dependencies.docify]
workspace = true

[dependencies.frame-benchmarking]
workspace = true
optional = true

[dependencies.frame-support]
workspace = true

[dependencies.frame-system]
workspace = true

[dependencies.scale-info]
workspace = true
features = ["derive"]

[dependencies.serde]
features = ["derive"]
optional = true
workspace = true

[dependencies.sp-core]
workspace = true

[dependencies.sp-io]
workspace = true

[dependencies.sp-runtime]
workspace = true

[dependencies.sp-std]
workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "serde?/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-std/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "sp-runtime/try-runtime",
]
