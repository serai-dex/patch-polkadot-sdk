[package]
name = "pallet-scheduler"
version = "41.2.0"
license = "Apache-2.0"
description = "FRAME Scheduler pallet"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.docify]
workspace = true

[dependencies.frame-benchmarking]
optional = true
workspace = true

[dependencies.frame-support]
workspace = true

[dependencies.frame-system]
workspace = true

[dependencies.log]
workspace = true

[dependencies.scale-info]
features = ["derive"]
workspace = true

[dependencies.sp-io]
workspace = true

[dependencies.sp-runtime]
workspace = true

[dependencies.sp-weights]
workspace = true

[features]
default = ["std"]
runtime-benchmarks = [
    "frame-benchmarking",
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
]
std = [
    "codec/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "log/std",
    "scale-info/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-weights/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "sp-runtime/try-runtime",
]
