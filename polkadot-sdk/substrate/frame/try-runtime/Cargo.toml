[package]
name = "frame-try-runtime"
version = "0.51.0"
license = "Apache-2.0"
description = "Supporting types for try-runtime, testing and dry-running commands."

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.frame-support]
workspace = true

[dependencies.sp-api]
workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-support/std",
    "sp-api/std",
]
try-runtime = ["frame-support/try-runtime"]
