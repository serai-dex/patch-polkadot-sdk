[package]
name = "pallet-transaction-payment-rpc-runtime-api"
version = "40.0.0"
license = "Apache-2.0"
description = "RPC runtime API for transaction payment FRAME pallet"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.pallet-transaction-payment]
workspace = true

[dependencies.sp-api]
workspace = true

[dependencies.sp-runtime]
workspace = true

[dependencies.sp-weights]
workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "pallet-transaction-payment/std",
    "sp-api/std",
    "sp-runtime/std",
    "sp-weights/std",
]
