[package]
name = "frame-benchmarking"
version = "40.2.1"
license = "Apache-2.0"
description = "Macro for benchmarking a FRAME runtime."
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
workspace = true

[dependencies.frame-support-procedural]
workspace = true

[dependencies.frame-support]
workspace = true

[dependencies.frame-system]
workspace = true

[dependencies.linregress]
optional = true
workspace = true

[dependencies.log]
workspace = true

[dependencies.paste]
workspace = true
default-features = true

[dependencies.scale-info]
features = ["derive"]
workspace = true

[dependencies.serde]
optional = true
workspace = true
default-features = true

[dependencies.sp-api]
workspace = true

[dependencies.sp-application-crypto]
workspace = true

[dependencies.sp-core]
workspace = true

[dependencies.sp-io]
workspace = true

[dependencies.sp-runtime-interface]
workspace = true

[dependencies.sp-runtime]
workspace = true

[dependencies.sp-storage]
workspace = true

[dependencies.static_assertions]
workspace = true
default-features = true

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-support-procedural/std",
    "frame-support/std",
    "frame-system/std",
    "linregress",
    "log/std",
    "scale-info/std",
    "serde",
    "sp-api/std",
    "sp-application-crypto/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime-interface/std",
    "sp-runtime/std",
    "sp-storage/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
]
