[package]
name = "pallet-proxy"
version = "40.1.0"
license = "Apache-2.0"
description = "FRAME proxying pallet"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["max-encoded-len"]
workspace = true

[dependencies.frame]
workspace = true
features = ["runtime"]

[dependencies.scale-info]
features = ["derive"]
workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "frame/std",
    "scale-info/std",
]
runtime-benchmarks = ["frame/runtime-benchmarks"]
try-runtime = ["frame/try-runtime"]
