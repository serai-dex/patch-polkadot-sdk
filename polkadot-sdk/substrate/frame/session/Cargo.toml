[package]
name = "pallet-session"
version = "49.0.0"
license = "Apache-2.0"
description = "FRAME sessions pallet"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.frame-support]
workspace = true

[dependencies.frame-system]
workspace = true

[dependencies.log]
workspace = true

[features]
default = [
    "historical",
    "std",
]
historical = []
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "log/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
