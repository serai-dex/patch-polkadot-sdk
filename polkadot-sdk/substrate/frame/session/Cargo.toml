[package]
name = "pallet-session"
version = "41.0.0"
license = "Apache-2.0"
description = "FRAME sessions pallet"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.frame-support]
workspace = true

[dependencies.frame-system]
workspace = true

[dependencies.impl-trait-for-tuples]
workspace = true

[dependencies.log]
workspace = true

[dependencies.pallet-timestamp]
workspace = true

[dependencies.sp-core]
features = ["serde"]
workspace = true

[dependencies.sp-io]
workspace = true

[dependencies.sp-runtime]
features = ["serde"]
workspace = true

[dependencies.sp-session]
workspace = true

[dependencies.sp-staking]
features = ["serde"]
workspace = true

[dependencies.sp-state-machine]
workspace = true

[dependencies.sp-trie]
optional = true
workspace = true

[features]
default = [
    "historical",
    "std",
]
historical = ["sp-trie"]
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "log/std",
    "pallet-timestamp/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-session/std",
    "sp-staking/std",
    "sp-state-machine/std",
    "sp-trie/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-timestamp/try-runtime",
    "sp-runtime/try-runtime",
]
