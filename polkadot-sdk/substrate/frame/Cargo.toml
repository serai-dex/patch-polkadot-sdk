[package]
name = "polkadot-sdk-frame"
version = "0.9.1"
authors = ["Parity Technologies <admin@parity.io>"]
license = "Apache-2.0"
homepage = "https://paritytech.github.io"
description = "Experimental: The single package to get you started with building frame pallets and runtimes"

[package.edition]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
features = ["experimental"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.frame-benchmarking]
optional = true
workspace = true

[dependencies.frame-executive]
optional = true
workspace = true

[dependencies.frame-support]
workspace = true

[dependencies.frame-system-benchmarking]
optional = true
workspace = true

[dependencies.frame-system-rpc-runtime-api]
optional = true
workspace = true

[dependencies.frame-system]
workspace = true

[dependencies.frame-try-runtime]
optional = true
workspace = true

[dependencies.scale-info]
features = ["derive"]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.sp-api]
optional = true
workspace = true

[dependencies.sp-arithmetic]
workspace = true

[dependencies.sp-block-builder]
optional = true
workspace = true

[dependencies.sp-consensus-aura]
optional = true
workspace = true

[dependencies.sp-consensus-grandpa]
optional = true
workspace = true

[dependencies.sp-core]
workspace = true

[dependencies.sp-genesis-builder]
optional = true
workspace = true

[dependencies.sp-inherents]
optional = true
workspace = true

[dependencies.sp-io]
workspace = true

[dependencies.sp-keyring]
optional = true
workspace = true

[dependencies.sp-offchain]
optional = true
workspace = true

[dependencies.sp-runtime]
workspace = true

[dependencies.sp-session]
optional = true
workspace = true

[dependencies.sp-storage]
optional = true
workspace = true

[dependencies.sp-transaction-pool]
optional = true
workspace = true

[dependencies.sp-version]
optional = true
workspace = true

[dependencies.docify]
workspace = true

[dependencies.log]
workspace = true

[features]
default = [
    "runtime",
    "std",
]
experimental = ["frame-support/experimental"]
runtime = [
    "frame-executive",
    "frame-system-rpc-runtime-api",
    "sp-api",
    "sp-block-builder",
    "sp-consensus-aura",
    "sp-consensus-grandpa",
    "sp-genesis-builder",
    "sp-inherents",
    "sp-keyring",
    "sp-offchain",
    "sp-session",
    "sp-storage",
    "sp-transaction-pool",
    "sp-version",
]
std = [
    "codec/std",
    "frame-benchmarking?/std",
    "frame-executive?/std",
    "frame-support/std",
    "frame-system-benchmarking?/std",
    "frame-system-rpc-runtime-api?/std",
    "frame-system/std",
    "frame-try-runtime?/std",
    "log/std",
    "scale-info/std",
    "serde/std",
    "sp-api?/std",
    "sp-arithmetic/std",
    "sp-block-builder?/std",
    "sp-consensus-aura?/std",
    "sp-consensus-grandpa?/std",
    "sp-core/std",
    "sp-genesis-builder?/std",
    "sp-inherents?/std",
    "sp-io/std",
    "sp-keyring?/std",
    "sp-offchain?/std",
    "sp-runtime/std",
    "sp-session?/std",
    "sp-storage/std",
    "sp-transaction-pool?/std",
    "sp-version?/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system-benchmarking/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
]
try-runtime = [
    "frame-executive/try-runtime",
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "frame-try-runtime/try-runtime",
    "sp-runtime/try-runtime",
]
