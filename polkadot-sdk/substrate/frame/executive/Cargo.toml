[package]
name = "frame-executive"
version = "46.0.0"
license = "Apache-2.0"
description = "FRAME executives engine"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.frame-support]
workspace = true

[dependencies.frame-system]
workspace = true

[dependencies.frame-try-runtime]
optional = true
workspace = true

[dependencies.log]
workspace = true

[dependencies.sp-core]
workspace = true

[dependencies.sp-io]
workspace = true

[dependencies.sp-runtime]
workspace = true

[dependencies.sp-tracing]
workspace = true

[features]
default = ["std"]
with-tracing = ["sp-tracing/with-tracing"]
std = [
    "codec/std",
    "frame-support/experimental",
    "frame-support/std",
    "frame-system/std",
    "frame-try-runtime/std",
    "log/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-tracing/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "frame-try-runtime/try-runtime",
    "sp-runtime/try-runtime",
]
