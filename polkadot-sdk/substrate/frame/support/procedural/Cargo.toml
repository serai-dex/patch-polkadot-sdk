[package]
name = "frame-support-procedural"
version = "33.0.1"
license = "Apache-2.0"
description = "Proc macro of Support code for the runtime."

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies.Inflector]
workspace = true

[dependencies.cfg-expr]
workspace = true

[dependencies.derive-syn-parse]
workspace = true

[dependencies.expander]
workspace = true

[dependencies.frame-support-procedural-tools]
default-features = true
workspace = true

[dependencies.itertools]
workspace = true

[dependencies.macro_magic]
features = ["proc_support"]
workspace = true

[dependencies.proc-macro-warning]
workspace = true

[dependencies.proc-macro2]
workspace = true

[dependencies.quote]
workspace = true

[dependencies.sp-crypto-hashing]
workspace = true

[dependencies.syn]
features = [
    "full",
    "parsing",
    "visit-mut",
]
workspace = true

[features]
default = ["std"]
std = ["sp-crypto-hashing/std"]
experimental = []
tuples-96 = []
tuples-128 = []
