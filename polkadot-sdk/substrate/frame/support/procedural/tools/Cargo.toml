[package]
name = "frame-support-procedural-tools"
version = "10.0.0"
license = "Apache-2.0"
description = "Proc macro helpers for procedural macros"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
