[package]
name = "frame-support-procedural-tools-derive"
version = "11.0.0"
license = "Apache-2.0"
description = "Use to derive parsing for parsing struct."

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies.proc-macro2]
workspace = true

[dependencies.quote]
features = ["proc-macro"]
workspace = true

[dependencies.syn]
features = [
    "extra-traits",
    "full",
    "parsing",
    "proc-macro",
]
workspace = true
