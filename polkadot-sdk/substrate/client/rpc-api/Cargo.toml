[package]
name = "sc-rpc-api"
version = "0.52.0"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
description = "Substrate RPC interfaces."
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
workspace = true
default-features = true

[dependencies.jsonrpsee]
features = [
    "client-core",
    "macros",
    "server-core",
]
workspace = true

[dependencies.sc-chain-spec]
default-features = true
workspace = true

[dependencies.serde]
features = ["derive"]
workspace = true
default-features = true

[dependencies.thiserror]
workspace = true
