[package]
description = "Substrate network protocol"
name = "sc-network"
version = "0.53.1"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
documentation = "https://docs.rs/sc-network"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
prometheus-client = "0.23"

[dependencies.array-bytes]
workspace = true
default-features = true

[dependencies.async-channel]
workspace = true

[dependencies.async-trait]
workspace = true

[dependencies.asynchronous-codec]
workspace = true

[dependencies.bytes]
workspace = true
default-features = true

[dependencies.codec]
features = ["derive"]
workspace = true
default-features = true

[dependencies.either]
workspace = true
default-features = true

[dependencies.fnv]
workspace = true

[dependencies.futures]
workspace = true

[dependencies.futures-timer]
workspace = true

[dependencies.ip_network]
workspace = true

[dependencies.libp2p]
features = [
    "dns",
    "identify",
    "kad",
    "macros",
    "mdns",
    "noise",
    "ping",
    "request-response",
    "tcp",
    "tokio",
    "websocket",
    "yamux",
    "metrics",
]
workspace = true

[dependencies.linked_hash_set]
workspace = true

[dependencies.litep2p]
workspace = true
optional = true

[dependencies.log]
workspace = true
default-features = true

[dependencies.parking_lot]
workspace = true
default-features = true

[dependencies.partial_sort]
workspace = true

[dependencies.pin-project]
workspace = true

[dependencies.prometheus-endpoint]
default-features = true
workspace = true

[dependencies.rand]
workspace = true
default-features = true

[dependencies.sc-client-api]
default-features = true
workspace = true

[dependencies.sc-network-common]
default-features = true
workspace = true

[dependencies.sc-network-types]
default-features = true
workspace = true

[dependencies.sc-utils]
default-features = true
workspace = true

[dependencies.schnellru]
workspace = true

[dependencies.serde]
features = ["derive"]
workspace = true
default-features = true

[dependencies.serde_json]
workspace = true
default-features = true

[dependencies.smallvec]
workspace = true
default-features = true

[dependencies.sp-arithmetic]
default-features = true
workspace = true

[dependencies.sp-blockchain]
default-features = true
workspace = true

[dependencies.sp-core]
default-features = true
workspace = true

[dependencies.sp-runtime]
default-features = true
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.tokio]
features = [
    "macros",
    "sync",
]
workspace = true
default-features = true

[dependencies.tokio-stream]
workspace = true

[dependencies.unsigned-varint]
features = [
    "asynchronous_codec",
    "futures",
]
workspace = true

[dependencies.zeroize]
workspace = true
default-features = true

[build-dependencies]

[features]
default = []
litep2p = [
    "dep:litep2p",
    "sc-network-types/litep2p",
]
