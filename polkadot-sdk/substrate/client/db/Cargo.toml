[package]
name = "sc-client-db"
version = "0.47.0"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
description = "Client backend that uses RocksDB database as storage."
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[lib]
bench = false

[dependencies.codec]
features = ["derive"]
workspace = true
default-features = true

[dependencies.hash-db]
workspace = true
default-features = true

[dependencies.kvdb]
workspace = true

[dependencies.kvdb-memorydb]
workspace = true

[dependencies.kvdb-rocksdb]
optional = true
workspace = true

[dependencies.linked-hash-map]
workspace = true

[dependencies.log]
workspace = true
default-features = true

[dependencies.parity-db]
workspace = true

[dependencies.parking_lot]
workspace = true
default-features = true

[dependencies.prometheus-endpoint]
default-features = true
workspace = true

[dependencies.sc-client-api]
default-features = true
workspace = true

[dependencies.sc-state-db]
default-features = true
workspace = true

[dependencies.schnellru]
workspace = true

[dependencies.sp-arithmetic]
default-features = true
workspace = true

[dependencies.sp-blockchain]
default-features = true
workspace = true

[dependencies.sp-core]
default-features = true
workspace = true

[dependencies.sp-database]
default-features = true
workspace = true

[dependencies.sp-runtime]
default-features = true
workspace = true

[dependencies.sp-state-machine]
default-features = true
workspace = true

[dependencies.sp-trie]
default-features = true
workspace = true

[dependencies.sysinfo]
workspace = true

[features]
default = []
test-helpers = []
runtime-benchmarks = ["sp-runtime/runtime-benchmarks"]
rocksdb = ["kvdb-rocksdb"]
