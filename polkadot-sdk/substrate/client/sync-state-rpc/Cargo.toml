[package]
name = "sc-sync-state-rpc"
version = "0.51.0"
description = "A RPC handler to create sync states for light clients."
license = "Apache-2.0"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
