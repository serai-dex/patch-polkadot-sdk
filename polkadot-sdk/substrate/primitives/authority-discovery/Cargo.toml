[package]
name = "sp-authority-discovery"
version = "36.0.0"
description = "Authority discovery primitives"
license = "Apache-2.0"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
workspace = true

[dependencies.scale-info]
features = ["derive"]
workspace = true

[dependencies.sp-api]
workspace = true

[dependencies.sp-application-crypto]
workspace = true

[dependencies.sp-runtime]
workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "sp-api/std",
    "sp-application-crypto/std",
    "sp-runtime/std",
]
serde = [
    "scale-info/serde",
    "sp-application-crypto/serde",
    "sp-runtime/serde",
]
