[package]
name = "sp-genesis-builder"
version = "0.17.0"
license = "Apache-2.0"
description = "Substrate RuntimeGenesisConfig builder API"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["bytes"]
workspace = true

[dependencies.scale-info]
features = ["derive"]
workspace = true

[dependencies.serde_json]
features = [
    "alloc",
    "arbitrary_precision",
]
workspace = true

[dependencies.sp-api]
workspace = true

[dependencies.sp-runtime]
workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "serde_json/std",
    "sp-api/std",
    "sp-runtime/std",
]
