[package]
name = "sp-version-proc-macro"
version = "13.0.0"
license = "Apache-2.0"
description = "Macro for defining a runtime version."
documentation = "https://docs.rs/sp-api-proc-macro"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies.codec]
features = ["derive"]
workspace = true
default-features = true

[dependencies.proc-macro-warning]
workspace = true

[dependencies.proc-macro2]
workspace = true

[dependencies.quote]
workspace = true

[dependencies.syn]
features = [
    "extra-traits",
    "fold",
    "full",
    "visit",
]
workspace = true
