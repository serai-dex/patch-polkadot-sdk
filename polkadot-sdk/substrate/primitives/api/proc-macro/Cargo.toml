[package]
name = "sp-api-proc-macro"
version = "29.0.0"
license = "Apache-2.0"
description = "Macros for declaring and implementing runtime apis."
documentation = "https://docs.rs/sp-api-proc-macro"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies.Inflector]
workspace = true

[dependencies.blake2]
workspace = true

[dependencies.proc-macro-crate]
workspace = true

[dependencies.proc-macro2]
workspace = true

[dependencies.quote]
workspace = true

[dependencies.syn]
features = [
    "extra-traits",
    "fold",
    "full",
    "visit",
    "visit-mut",
]
workspace = true

[features]
default = ["std"]
std = ["blake2/alloc"]
