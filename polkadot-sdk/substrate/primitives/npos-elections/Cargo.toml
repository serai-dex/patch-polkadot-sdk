[package]
name = "sp-npos-elections"
version = "36.2.0"
license = "Apache-2.0"
description = "NPoS election algorithm primitives"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.scale-info]
features = ["derive"]
workspace = true

[dependencies.serde]
features = [
    "alloc",
    "derive",
]
optional = true
workspace = true

[dependencies.sp-arithmetic]
workspace = true

[dependencies.sp-core]
workspace = true

[dependencies.sp-runtime]
workspace = true

[features]
default = ["std"]
bench = []
std = [
    "codec/std",
    "scale-info/std",
    "serde/std",
    "sp-arithmetic/std",
    "sp-core/std",
    "sp-runtime/std",
]
serde = [
    "dep:serde",
    "scale-info/serde",
    "sp-arithmetic/serde",
    "sp-core/serde",
    "sp-runtime/serde",
]
