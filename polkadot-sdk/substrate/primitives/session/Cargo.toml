[package]
name = "sp-session"
version = "39.0.0"
license = "Apache-2.0"
description = "Primitives for sessions"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.sp-api]
workspace = true

[dependencies.sp-core]
workspace = true

[dependencies.sp-keystore]
optional = true
workspace = true

[dependencies.sp-runtime]
optional = true
workspace = true

[dependencies.sp-staking]
workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "sp-api/std",
    "sp-core/std",
    "sp-keystore/std",
    "sp-runtime/std",
    "sp-staking/std",
]
