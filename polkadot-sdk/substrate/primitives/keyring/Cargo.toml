[package]
name = "sp-keyring"
version = "44.0.0"
license = "Apache-2.0"
description = "Keyring support code for the runtime. A set of test accounts."
documentation = "https://docs.rs/sp-keyring"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.sp-core]
workspace = true

[dependencies.sp-runtime]
workspace = true

[dependencies.strum]
features = ["derive"]
workspace = true

[features]
default = ["std"]
std = [
    "sp-core/std",
    "sp-runtime/std",
    "strum/std",
]
