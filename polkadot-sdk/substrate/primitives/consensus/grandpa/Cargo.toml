[package]
name = "sp-consensus-grandpa"
version = "30.0.0"
license = "Apache-2.0"
description = "Primitives for GRANDPA integration, suitable for WASM compilation."
documentation = "https://docs.rs/sp-consensus-grandpa"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.finality-grandpa]
features = ["derive-codec"]
workspace = true

[dependencies.log]
workspace = true

[dependencies.serde]
features = [
    "alloc",
    "derive",
]
optional = true
workspace = true

[dependencies.sp-api]
workspace = true

[dependencies.sp-application-crypto]
workspace = true

[dependencies.sp-core]
workspace = true

[dependencies.sp-keystore]
optional = true
workspace = true

[dependencies.sp-runtime]
workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "finality-grandpa/std",
    "log/std",
    "serde/std",
    "sp-api/std",
    "sp-application-crypto/std",
    "sp-core/std",
    "sp-keystore/std",
    "sp-runtime/std",
]
serde = [
    "dep:serde",
    "sp-application-crypto/serde",
    "sp-core/serde",
    "sp-runtime/serde",
]
