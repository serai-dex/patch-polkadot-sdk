[package]
name = "sp-consensus-babe"
version = "0.43.0"
description = "Primitives for BABE consensus"
license = "Apache-2.0"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.async-trait]
optional = true
workspace = true

[dependencies.codec]
workspace = true

[dependencies.serde]
features = [
    "alloc",
    "derive",
]
optional = true
workspace = true

[dependencies.sp-api]
workspace = true

[dependencies.sp-application-crypto]
workspace = true

[dependencies.sp-consensus-slots]
workspace = true

[dependencies.sp-core]
workspace = true

[dependencies.sp-inherents]
workspace = true

[dependencies.sp-runtime]
workspace = true

[dependencies.sp-timestamp]
optional = true
workspace = true

[features]
default = ["std"]
std = [
    "async-trait",
    "codec/std",
    "serde/std",
    "sp-api/std",
    "sp-application-crypto/std",
    "sp-consensus-slots/std",
    "sp-core/std",
    "sp-inherents/std",
    "sp-runtime/std",
    "sp-timestamp/std",
]
serde = [
    "dep:serde",
    "sp-application-crypto/serde",
    "sp-consensus-slots/serde",
    "sp-core/serde",
    "sp-runtime/serde",
]
