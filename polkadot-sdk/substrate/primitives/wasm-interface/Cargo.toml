[package]
name = "sp-wasm-interface"
version = "21.0.1"
license = "Apache-2.0"
description = "Types and traits for interfacing between the host and the wasm runtime."
documentation = "https://docs.rs/sp-wasm-interface"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.anyhow]
optional = true
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.impl-trait-for-tuples]
workspace = true

[dependencies.log]
optional = true
workspace = true
default-features = true

[dependencies.wasmtime]
optional = true
workspace = true

[features]
default = ["std"]
std = [
    "anyhow?/std",
    "codec/std",
    "log/std",
]
wasmtime = [
    "anyhow",
    "dep:wasmtime",
]
