[package]
name = "sp-storage"
version = "22.0.0"
description = "Storage related primitives"
license = "Apache-2.0"
documentation = "https://docs.rs/sp-storage/"
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.impl-serde]
optional = true
workspace = true

[dependencies.ref-cast]
workspace = true

[dependencies.serde]
features = [
    "alloc",
    "derive",
]
optional = true
workspace = true

[dependencies.sp-debug-derive]
workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "impl-serde/std",
    "serde/std",
    "sp-debug-derive/std",
]
serde = [
    "dep:serde",
    "impl-serde",
]
