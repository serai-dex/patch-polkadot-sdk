[package]
name = "sp-io"
version = "40.0.1"
license = "Apache-2.0"
description = "I/O for Substrate runtimes"
documentation = "https://docs.rs/sp-io"
readme = "README.md"
build = "build.rs"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.bytes]
workspace = true

[dependencies.codec]
features = ["bytes"]
workspace = true

[dependencies.libsecp256k1]
optional = true
workspace = true
default-features = true

[dependencies.log]
optional = true
workspace = true
default-features = true

[dependencies.secp256k1]
features = [
    "global-context",
    "recovery",
]
optional = true
workspace = true
default-features = true

[dependencies.sp-core]
workspace = true

[dependencies.sp-crypto-hashing]
workspace = true

[dependencies.sp-externalities]
workspace = true

[dependencies.sp-keystore]
optional = true
workspace = true

[dependencies.sp-runtime-interface]
workspace = true

[dependencies.sp-state-machine]
optional = true
workspace = true

[dependencies.sp-tracing]
workspace = true

[dependencies.sp-trie]
optional = true
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.tracing-core]
workspace = true

[dependencies.ed25519-dalek]
optional = true
workspace = true

[dependencies.docify]
workspace = true

[target.'cfg(all(any(target_arch = "riscv32", target_arch = "riscv64"), substrate_runtime))'.dependencies.polkavm-derive]
workspace = true

[build-dependencies.rustversion]
workspace = true

[features]
default = ["std"]
std = [
    "bytes/std",
    "codec/std",
    "ed25519-dalek",
    "ed25519-dalek?/std",
    "libsecp256k1",
    "log/std",
    "secp256k1",
    "sp-core/std",
    "sp-crypto-hashing/std",
    "sp-externalities/std",
    "sp-keystore/std",
    "sp-runtime-interface/std",
    "sp-state-machine/std",
    "sp-tracing/std",
    "sp-trie/std",
    "tracing-core/std",
    "tracing/std",
]
with-tracing = ["sp-tracing/with-tracing"]
disable_panic_handler = []
disable_oom = []
disable_allocator = []
improved_panic_error_reporting = []
