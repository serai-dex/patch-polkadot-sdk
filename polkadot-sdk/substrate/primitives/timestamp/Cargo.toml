[package]
name = "sp-timestamp"
version = "36.0.0"
license = "Apache-2.0"
description = "Substrate core types and inherents for timestamps."
readme = "README.md"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.async-trait]
optional = true
workspace = true

[dependencies.codec]
features = ["derive"]
workspace = true

[dependencies.sp-inherents]
workspace = true

[dependencies.sp-runtime]
workspace = true

[dependencies.thiserror]
optional = true
workspace = true

[features]
default = ["std"]
std = [
    "async-trait",
    "codec/std",
    "sp-inherents/std",
    "sp-runtime/std",
    "thiserror",
]
