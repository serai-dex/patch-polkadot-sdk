[package]
name = "sp-metadata-ir"
version = "0.10.0"
license = "Apache-2.0"
description = "Intermediate representation of the runtime metadata."
documentation = "https://docs.rs/sp-metadata-ir"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies.codec]
workspace = true

[dependencies.frame-metadata]
features = [
    "current",
    "unstable",
]
workspace = true

[dependencies.scale-info]
features = ["derive"]
workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-metadata/std",
    "scale-info/std",
]
