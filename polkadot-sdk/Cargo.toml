[profile.release]
opt-level = 3
panic = "unwind"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.backtrace]
inherits = "release"

[profile.production]
codegen-units = 1
inherits = "release"
lto = true

[profile.testnet]
debug = 1
debug-assertions = true
inherits = "release"
overflow-checks = true
