[workspace.package]
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"
homepage = "https://paritytech.github.io/polkadot-sdk/"
license = "GPL-3.0-only"
repository = "https://github.com/paritytech/polkadot-sdk.git"

[workspace.lints.rust.suspicious_double_ref_op]
level = "allow"
priority = 2

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(build_opt_level, values("3"))',
    'cfg(build_profile, values("debug", "release"))',
    "cfg(enable_alloc_error_handler)",
    "cfg(fuzzing)",
    "cfg(substrate_runtime)",
]

[workspace.lints.clippy.all]
level = "allow"
priority = 0

[workspace.lints.clippy.bind_instead_of_map]
level = "allow"
priority = 2

[workspace.lints.clippy.borrowed-box]
level = "allow"
priority = 2

[workspace.lints.clippy.complexity]
level = "warn"
priority = 1

[workspace.lints.clippy.correctness]
level = "warn"
priority = 1

[workspace.lints.clippy.default_constructed_unit_structs]
level = "allow"
priority = 2

[workspace.lints.clippy.derivable_impls]
level = "allow"
priority = 2

[workspace.lints.clippy.eq_op]
level = "allow"
priority = 2

[workspace.lints.clippy.erasing_op]
level = "allow"
priority = 2

[workspace.lints.clippy.extra-unused-type-parameters]
level = "allow"
priority = 2

[workspace.lints.clippy.identity-op]
level = "allow"
priority = 2

[workspace.lints.clippy.if-same-then-else]
level = "allow"
priority = 2

[workspace.lints.clippy.needless-lifetimes]
level = "allow"
priority = 2

[workspace.lints.clippy.needless_option_as_deref]
level = "allow"
priority = 2

[workspace.lints.clippy.nonminimal-bool]
level = "allow"
priority = 2

[workspace.lints.clippy.option-map-unit-fn]
level = "allow"
priority = 2

[workspace.lints.clippy.stable_sort_primitive]
level = "allow"
priority = 2

[workspace.lints.clippy.too-many-arguments]
level = "allow"
priority = 2

[workspace.lints.clippy.type_complexity]
level = "allow"
priority = 2

[workspace.lints.clippy.unit_arg]
level = "allow"
priority = 2

[workspace.lints.clippy.unnecessary_cast]
level = "allow"
priority = 2

[workspace.lints.clippy.useless_conversion]
level = "allow"
priority = 2

[workspace.lints.clippy.while_immutable_condition]
level = "allow"
priority = 2

[workspace.lints.clippy.zero-prefixed-literal]
level = "allow"
priority = 2

