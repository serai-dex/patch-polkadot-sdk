[package]
name = "serai-polkadot-sdk"
version = "0.1.0"
description = "Binary to generate the `polkadot-sdk` in the optimal form for Serai"
license = "AGPL-3.0-only"
repository = "https://github.com/serai-dex/polkadot-sdk"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = []
edition = "2021"

[dependencies]
toml = { version = "1", default-features = false, features = ["std", "preserve_order", "serde", "parse", "display"] }
semver = { version = "1", default-features = false, features = ["std"] }
