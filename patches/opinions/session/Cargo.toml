[package]
name = "pallet-session"
version = "41.0.0"
description = "Session pallet"
license = "AGPL-3.0-only"
repository = "https://github.com/serai-dex/patch-polkadot-sdk/tree/develop/patches/opinions/session"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
edition = "2021"
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
codec = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }

frame-system = { path = "../system", default-features = false }
frame-support = { path = "../support", default-features = false }

pallet-session-original = { path = "./session", default-features = false }

[features]
std = [
  "codec/std",

  "frame-system/std",
  "frame-support/std",

  "pallet-session-original/std",
]

runtime-benchmarks = [
  "frame-system/runtime-benchmarks",
  "frame-support/runtime-benchmarks",
]

try-runtime = []

default = ["std"]

historical = ["pallet-session-original/historical"]
